<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyspter</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            margin: 0;
        }
        .player-card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            width: 380px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            margin-bottom: 25px;
        }
        button {
            background-color: #1db954;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px 0;
            transition: 0.2s;
        }
        button:hover { background-color: #1ed760; }
        
        .game-container {
            width: 95%;
            max-width: 850px;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px auto;
            max-width: 400px;
            text-align: left;
        }
        .input-group label { font-size: 14px; color: #b3b3b3; }
        input[type="text"], select {
            padding: 10px 14px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: white;
            outline: none;
        }
        select { cursor: pointer; }
        .timeline-list {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
        }
        .card {
            background: #282828;
            border: 2px solid #1db954;
            padding: 15px;
            border-radius: 10px;
            min-width: 140px;
            max-width: 160px;
            text-align: center;
        }
        .card .year { font-size: 22px; font-weight: bold; color: #1db954; }
        .card .details { font-size: 13px; color: #ffffff; margin-top: 5px; }
        .card .artist { color: #b3b3b3; font-size: 11px; }
        .card-number { font-size: 10px; background: #404040; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 5px; }
        .result-msg { font-weight: bold; font-size: 16px; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="player-card">
    <h2>Gyspter JÁTÉK</h2>
    <p>Találd ki az előadót, címet és helyezd el a kártyát az idővonalon!</p>
    
    <audio id="audio-player"></audio>
    <button id="play-btn">🎵 Új Következő Zene Lejátszása</button>
</div>

<div class="game-container">
    <h3>Tippeld meg és helyezd el!</h3>
    
    <div class="input-group">
        <label for="position-select">Hova tartozik az idővonalon?</label>
        <select id="position-select">
            <!-- A JavaScript dinamikusan tölti fel a lehetőségeket -->
        </select>

        <label for="artist-input">Előadó:</label>
        <input type="text" id="artist-input" placeholder="pl. Döndi Duó">
        
        <label for="title-input">Cím:</label>
        <input type="text" id="title-input" placeholder="pl. Álmodtam egy világot magamnak">
    </div>

    <button id="submit-btn" style="max-width: 400px; width: 100%;">Tipp Beküldése</button>

    <div id="result" class="result-msg"></div>

    <h4>Jelenlegi Idővonal:</h4>
    <div id="timeline" class="timeline-list"></div>
</div>

<script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const submitBtn = document.getElementById('submit-btn');
    const positionSelect = document.getElementById('position-select');
    
    const artistInput = document.getElementById('artist-input');
    const titleInput = document.getElementById('title-input');
    
    const resultEl = document.getElementById('result');
    const timelineEl = document.getElementById('timeline');

    let songsData = [];
    let currentSong = null;
    let placedCards = []; // Idővonalon lévő kártyák
    let stopTimeout = null;

    // JSON betöltése és KEZDŐZENE beállítása
    fetch('songs.json')
        .then(res => res.json())
        .then(data => { 
            songsData = data; 
            startNewGame();
        })
        .catch(err => console.error("JSON hiba:", err));

    function getRandomNumber(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function cleanString(str) {
        return str ? str.toString().toLowerCase().trim() : "";
    }

    // Játék indítása: Egy random kezdőkártyát leteszünk az idővonalra
    function startNewGame() {
        if (songsData.length === 0) return;
        
        // Első zene kiválasztása kezdőkártyának
        const startIndex = getRandomNumber(0, songsData.length - 1);
        const starterSong = songsData[startIndex];

        placedCards.push({
            year: parseInt(starterSong.year),
            title: starterSong.title,
            artist: starterSong.artist
        });

        // Eltávolítjuk a választható dalok közül, hogy ne ismétlődjön
        songsData.splice(startIndex, 1);

        renderTimeline();
        updatePositionOptions();
    }

    // Pozíció opciók frissítése (Legelére, Két kártya közé, Legvégére)
    function updatePositionOptions() {
        positionSelect.innerHTML = "";

        // 1. Legelére
        const firstOpt = document.createElement('option');
        firstOpt.value = 0;
        firstOpt.textContent = `A legelére (kisebb mint ${placedCards[0].year})`;
        positionSelect.appendChild(firstOpt);

        // 2. Kártyák közé
        for (let i = 0; i < placedCards.length - 1; i++) {
            const opt = document.createElement('option');
            opt.value = i + 1;
            opt.textContent = `${i + 1}. [${placedCards[i].year}] és ${i + 2}. [${placedCards[i + 1].year}] kártyák közé`;
            positionSelect.appendChild(opt);
        }

        // 3. Legvégére (Ha több kártya van)
        if (placedCards.length > 0) {
            const lastOpt = document.createElement('option');
            lastOpt.value = placedCards.length;
            lastOpt.textContent = `A legvégére (nagyobb mint ${placedCards[placedCards.length - 1].year})`;
            positionSelect.appendChild(lastOpt);
        }
    }

    // Következő zene indítása
// Következő zene indítása (30 mp hallgatás, 0 és a vége-30 mp között bármhonnan)
    playBtn.addEventListener('click', () => {
        if (songsData.length === 0) return alert("Nincs több elérhető zene a JSON-ben!");
        if (stopTimeout) clearTimeout(stopTimeout);
        resultEl.textContent = "";

        const randomIndex = getRandomNumber(0, songsData.length - 1);
        currentSong = songsData[randomIndex];
        audio.src = currentSong.src;

        audio.onloadedmetadata = () => {
            const playDuration = 30; // Pontosan fél perc (30 mp)
            const totalDuration = audio.duration; // A zene teljes hossza mp-ben

            let startTime = 0;

            // Ha a zene hosszabb mint 30 másodperc, random helyről indítjuk
            if (totalDuration > playDuration) {
                // Megkeressük a legkésőbbi indítási pontot, ahonnan még elfér a 30 mp
                const maxStartTime = Math.floor(totalDuration - playDuration);
                startTime = getRandomNumber(0, maxStartTime);
            } else {
                // Ha a zene rövidebb lenne 30 mp-nél, az elejétől indítjuk
                startTime = 0;
            }

            audio.currentTime = startTime;
            audio.play().catch(e => console.error("Lejátszási hiba:", e));

            // Pontosan 30 másodperc (30 000 ms) múlva leállítjuk
            stopTimeout = setTimeout(() => {
                audio.pause();
            }, playDuration * 1000);
        };
    });

    // Tipp ellenőrzése
    submitBtn.addEventListener('click', () => {
        if (!currentSong) return alert("Először indíts el egy zenét!");

        const chosenIndex = parseInt(positionSelect.value);
        const guessedArtist = cleanString(artistInput.value);
        const guessedTitle = cleanString(titleInput.value);

        audio.pause();

        const songYear = parseInt(currentSong.year);
        const actualArtist = cleanString(currentSong.artist);
        const actualTitle = cleanString(currentSong.title);

        // Idővonal pozíció ellenőrzése
        let isPositionCorrect = false;
        
        const prevCard = placedCards[chosenIndex - 1];
        const nextCard = placedCards[chosenIndex];

        const minYear = prevCard ? prevCard.year : -Infinity;
        const maxYear = nextCard ? nextCard.year : Infinity;

        if (songYear >= minYear && songYear <= maxYear) {
            isPositionCorrect = true;
        }

        const isArtistCorrect = guessedArtist === actualArtist;
        const isTitleCorrect = guessedTitle === actualTitle;

        // Ha ROSSZ helyre tette, ROSSZ az év pozíciója -> NEM kerül fel az idővonalra!
        if (!isPositionCorrect) {
            resultEl.style.color = "#ff4d4d";
            resultEl.textContent = `❌ ROSSZ HELYRE TETTED! A zene (${currentSong.artist} - ${currentSong.title}) éve: ${songYear}. A kártya kiesett!`;
        } 
        else if (isPositionCorrect && isArtistCorrect && isTitleCorrect) {
            resultEl.style.color = "#1db954";
            resultEl.textContent = `🎯 TÖKÉLETES! Jó helyre tetted (${songYear}) és az adatok is helyesek!`;
            
            // Sikeres kártya hozzáadása az idővonalhoz
            placedCards.splice(chosenIndex, 0, {
                year: songYear,
                title: currentSong.title,
                artist: currentSong.artist
            });
        } 
        else {
            resultEl.style.color = "#ffb703";
            resultEl.textContent = `⚠️ A helye jó volt (${songYear}), de az előadó/cím hibás! A kártya felkerült az idővonalra.`;
            
            placedCards.splice(chosenIndex, 0, {
                year: songYear,
                title: currentSong.title,
                artist: currentSong.artist
            });
        }

        // Felhasznált zene törlése a pakliból
        const songIdxInDeck = songsData.indexOf(currentSong);
        if (songIdxInDeck > -1) songsData.splice(songIdxInDeck, 1);

        renderTimeline();
        updatePositionOptions();
        
        // Alaphelyzet
        currentSong = null;
        artistInput.value = "";
        titleInput.value = "";
    });

    function renderTimeline() {
        timelineEl.innerHTML = "";
        placedCards.forEach((card, index) => {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            cardDiv.innerHTML = `
                <span class="card-number">#${index + 1}</span>
                <div class="year">${card.year}</div>
                <div class="artist">${card.artist}</div>
                <div class="details"><b>${card.title}</b></div>
            `;
            timelineEl.appendChild(cardDiv);
        });
    }
</script>

</body>
</html>
