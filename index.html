<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mulatós Hitster</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
        .card { border: 2px solid #e91e63; padding: 15px; margin: 10px; display: inline-block; border-radius: 8px; background: #1e1e1e; }
        .timeline { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
        button { background: #e91e63; color: white; border: none; padding: 12px 24px; font-size: 18px; cursor: pointer; border-radius: 5px; margin: 10px; }
        button:hover { background: #c2185b; }
        /* Elrejtjük a YouTube videólejátszót, csak a hang kell */
        #youtube-player { display: none; }
    </style>
</head>
<body>

    <h1>🎤 Mulatós Hitster</h1>
    <p>Találd ki, mikor jelent meg a dal!</p>

    <!-- Zene gombok -->
    <div id="player-container">
        <button onclick="playCurrentSong()">🎵 Zene Lejátszása</button>
        <button onclick="pauseCurrentSong()">⏸️ Szünet</button>
    </div>

    <h3>Idővonal:</h3>
    <div class="timeline" id="timeline"></div>

    <!-- Rejtett YouTube iframe konténer -->
    <div id="youtube-player"></div>

    <!-- YouTube API betöltése -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let songs = [];
        let timeline = [];
        let currentSong = null;
        let player = null;
        let isPlayerReady = false;

        // YouTube lejátszó előkészítése
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                events: {
                    'onReady': () => { isPlayerReady = true; }
                }
            });
        }

        // JSON fájl betöltése
        async function loadSongs() {
            try {
                const response = await fetch('./songs.json');
                songs = await response.json();
                initGame();
            } catch (error) {
                console.error("Hiba a JSON betöltésekor:", error);
                alert("Nem sikerült betölteni a dalokat!");
            }
        }

        function initGame() {
            if (songs.length === 0) return;

            // Első kártya lerakása
            const firstSong = songs.pop();
            timeline.push(firstSong);
            renderTimeline();
            nextTurn();
        }

        function nextTurn() {
            if (songs.length === 0) {
                alert("Gratulálok, elfogyott a pakli!");
                return;
            }
            currentSong = songs.pop();
        }

        function playCurrentSong() {
            if (currentSong && player && isPlayerReady) {
                player.loadVideoById(currentSong.youtubeId);
                player.playVideo();
            } else if (!isPlayerReady) {
                alert("A lejátszó még töltődik, próbáld újra egy pillanat múlva!");
            }
        }

        function pauseCurrentSong() {
            if (player && isPlayerReady) {
                player.pauseVideo();
            }
        }

        function renderTimeline() {
            const container = document.getElementById("timeline");
            container.innerHTML = "";

            timeline.forEach((song) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `<strong>${song.eloado}</strong><br>${song.cim}<br><em>${song.ev}</em>`;
                container.appendChild(card);
            });
        }

        // Indítás
        loadSongs();
    </script>
</body>
</html>
