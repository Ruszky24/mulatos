<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎤 Mulatós Hitster</title>
    <style>
        :root {
            --primary: #e91e63;
            --bg: #121212;
            --card-bg: #1e1e1e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 { color: var(--primary); font-size: 2.5rem; margin-bottom: 5px; }
        .score-board { font-size: 1.2rem; margin-bottom: 20px; color: #ffeb3b; }

        .controls {
            background: #252525;
            padding: 20px;
            border-radius: 12px;
            max-width: 500px;
            margin: 0 auto 30px auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            margin: 5px;
        }

        button:hover { background: #c2185b; transform: scale(1.05); }
        button:disabled { background: #555; cursor: not-allowed; transform: none; }

        .guess-btn { background: #2196F3; }
        .guess-btn:hover { background: #1976D2; }

        .timeline {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .card {
            border: 2px solid var(--primary);
            padding: 15px;
            border-radius: 10px;
            background: var(--card-bg);
            min-width: 140px;
            box-shadow: 0 4px 10px rgba(233, 30, 99, 0.3);
        }

        .card.active-guess { border-color: #ffeb3b; background: #332b00; }
        .card-year { font-size: 1.4rem; font-weight: bold; color: var(--primary); margin-top: 5px; }

        #youtube-player { display: none; }
        #status-msg { margin-top: 10px; font-style: italic; color: #bbb; }
    </style>
</head>
<body>

    <h1>🎤 Mulatós Hitster</h1>
    <div class="score-board">Pontszám: <span id="score">0</span> pont</div>

    <div class="controls">
        <div id="status-msg">⏳ Töltés...</div>
        <br>
        <button id="playBtn" onclick="playSong()" disabled>🎵 Zene Lejátszása</button>
        <button id="pauseBtn" onclick="pauseSong()" disabled>⏸️ Szünet</button>
    </div>

    <h2>Idővonal</h2>
    <div class="timeline" id="timeline"></div>

    <!-- Rejtett YouTube Lejátszó -->
    <div id="youtube-player"></div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let songs = [];
        let timeline = [];
        let currentSong = null;
        let score = 0;
        let player = null;
        let isPlayerReady = false;

        // YouTube ID kiszedő függvény
        function extractYouTubeId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                events: {
                    'onReady': () => {
                        isPlayerReady = true;
                        document.getElementById('status-msg').innerText = "✅ Készen áll! Indítsd a zenét.";
                    }
                }
            });
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        async function loadSongs() {
            try {
                const response = await fetch('./songs.json?v=' + new Date().getTime());
                songs = await response.json();
                shuffle(songs);
                initGame();
            } catch (error) {
                document.getElementById('status-msg').innerText = "❌ Hiba a songs.json betöltésekor!";
            }
        }

        function initGame() {
            if (songs.length === 0) return;
            // Első kártya letétele fixnek az idővonalra
            const firstSong = songs.pop();
            timeline.push(firstSong);
            
            nextTurn();
        }

        function nextTurn() {
            if (songs.length === 0) {
                alert(`Játék vége! Végső pontszámod: ${score}`);
                return;
            }

            currentSong = songs.pop();
            renderTimeline();

            document.getElementById('playBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = false;
            document.getElementById('status-msg').innerText = "🎶 Új dal betöltve. Hallgasd meg és tippeld meg a helyét!";
        }

        function playSong() {
            if (!currentSong || !player || !isPlayerReady) return;
            const videoId = extractYouTubeId(currentSong.url);
            if (videoId) {
                player.loadVideoById(videoId);
                player.playVideo();
                document.getElementById('status-msg').innerText = "▶️ Zene szól...";
            } else {
                alert("Hibás YouTube link a JSON-ben!");
            }
        }

        function pauseSong() {
            if (player && isPlayerReady) {
                player.pauseVideo();
                document.getElementById('status-msg').innerText = "⏸️ Szüneteltetve";
            }
        }

        // Tippelési logika: ellenőrzi, jó helyre kerül-e a kártya az idővonalon
        function makeGuess(insertIndex) {
            pauseSong();

            let isCorrect = true;

            // Ellenőrizzük a bal oldali szomszédot
            if (insertIndex > 0 && timeline[insertIndex - 1].ev > currentSong.ev) {
                isCorrect = false;
            }
            // Ellenőrizzük a jobb oldali szomszédot
            if (insertIndex < timeline.length && timeline[insertIndex].ev < currentSong.ev) {
                isCorrect = false;
            }

            if (isCorrect) {
                alert(`🎯 Helyes! A dal: ${currentSong.eloado} - ${currentSong.cim} (${currentSong.ev})`);
                score++;
                document.getElementById('score').innerText = score;
                timeline.splice(insertIndex, 0, currentSong);
            } else {
                alert(`❌ Rossz tipp! A dal valójában ekkor jelent meg: ${currentSong.ev} (${currentSong.eloado} - ${currentSong.cim})`);
            }

            nextTurn();
        }

        function renderTimeline() {
            const container = document.getElementById("timeline");
            container.innerHTML = "";

            // Gomb az első helyre tippeléshez
            container.appendChild(createGuessButton(0));

            timeline.forEach((song, index) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <strong>${song.eloado}</strong><br>
                    <small>${song.cim}</small>
                    <div class="card-year">${song.ev}</div>
                `;
                container.appendChild(card);

                // Gomb a kártyák közötti/utáni tippeléshez
                container.appendChild(createGuessButton(index + 1));
            });
        }

        function createGuessButton(index) {
            const btn = document.createElement("button");
            btn.className = "guess-btn";
            btn.innerText = "📍 Ide teszem";
            btn.onclick = () => makeGuess(index);
            return btn;
        }

        loadSongs();
    </script>
</body>
</html>
