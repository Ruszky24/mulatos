<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mulatós Hitster</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
        .card { border: 2px solid #e91e63; padding: 15px; margin: 10px; display: inline-block; border-radius: 8px; background: #1e1e1e; }
        .timeline { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
        button { background: #e91e63; color: white; border: none; padding: 15px 25px; font-size: 18px; cursor: pointer; border-radius: 8px; margin: 8px; font-weight: bold; }
        #status { color: #ffeb3b; font-size: 14px; margin-bottom: 15px; }
        /* A YouTube iframe minimális méretű marad, de látható, mert a mobilok csak így engedik futtatni */
        #youtube-container { width: 100%; height: 60px; margin-top: 15px; overflow: hidden; opacity: 0.1; }
    </style>
</head>
<body>

    <h1>🎤 Mulatós Hitster</h1>
    <div id="status">⏳ Töltés...</div>

    <div>
        <button id="playBtn" onclick="playCurrentSong()">🎵 Zene Indítása</button>
        <button id="pauseBtn" onclick="pauseCurrentSong()">⏸️ Szünet</button>
        <button id="nextBtn" onclick="nextTurn()">⏭️ Következő kártya</button>
    </div>

    <!-- Rejtett lejátszó ablak a mobil kompatibilitáshoz -->
    <div id="youtube-container">
        <div id="player"></div>
    </div>

    <h3>Idővonal:</h3>
    <div class="timeline" id="timeline"></div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let songs = [];
        let timeline = [];
        let currentSong = null;
        let player = null;
        let isPlayerReady = false;

        // FŐ TRÜKK: Kiszedi a YouTube ID-t BÁRMILYEN YouTube linkből!
        function extractYouTubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '60',
                width: '200',
                events: {
                    'onReady': () => {
                        isPlayerReady = true;
                        document.getElementById('status').innerText = "✅ Lejátszó kész!";
                    }
                }
            });
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        async function loadSongs() {
            try {
                const response = await fetch('./songs.json?v=' + new Date().getTime());
                songs = await response.json();
                shuffle(songs);
                initGame();
            } catch (error) {
                document.getElementById('status').innerText = "❌ Hiba a JSON betöltésekor!";
            }
        }

        function initGame() {
            if (songs.length === 0) return;
            const firstSong = songs.pop();
            timeline.push(firstSong);
            renderTimeline();
            nextTurn();
        }

        function nextTurn() {
            if (songs.length === 0) {
                alert("Gratulálok, elfogyott a pakli!");
                return;
            }
            currentSong = songs.pop();
            document.getElementById('status').innerText = "🎶 Új dal betöltve. Nyomj a Zene Indítására!";
        }

        function playCurrentSong() {
            if (!currentSong) return;
            
            const videoId = extractYouTubeId(currentSong.url);
            if (!videoId) {
                alert("Hibás YouTube link a JSON-ben!");
                return;
            }

            if (player && isPlayerReady) {
                player.loadVideoById(videoId);
                player.playVideo();
                document.getElementById('status').innerText = "▶️ Zene szól...";
            } else {
                alert("A lejátszó még töltődik, próbáld újra egy pillanat múlva!");
            }
        }

        function pauseCurrentSong() {
            if (player && isPlayerReady) {
                player.pauseVideo();
                document.getElementById('status').innerText = "⏸️ Szüneteltetve";
            }
        }

        function renderTimeline() {
            const container = document.getElementById("timeline");
            container.innerHTML = "";
            timeline.forEach((song) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `<strong>${song.eloado}</strong><br>${song.cim}<br><em>${song.ev}</em>`;
                container.appendChild(card);
            });
        }

        loadSongs();
    </script>
</body>
</html>
