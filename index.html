<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zene Lejátszó</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            color: white;
            margin: 0;
        }
        .player-card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        button {
            background-color: #1db954;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }
        button:hover {
            background-color: #1ed760;
        }
    </style>
</head>
<body>

<div class="player-card">
    <h2 id="song-title">Kattints az indításhoz!</h2>
    <p id="song-artist">-</p>
    
    <!-- A rejtett lejátszó elem -->
    <audio id="audio-player"></audio>
    
    <button id="play-btn">Random Refrén Lejátszása</button>
</div>

<script>
    const audio = document.getElementById('audio-player');
    const titleEl = document.getElementById('song-title');
    const artistEl = document.getElementById('song-artist');
    const playBtn = document.getElementById('play-btn');

    let songsData = [];

    // 1. JSON fájl betöltése (módosítsd a fájlnevet, ha a tied nem 'songs.json')
    fetch('songs.json')
        .then(response => {
            if (!response.ok) throw new Error("Nem sikerült betölteni a JSON fájlt!");
            return response.json();
        })
        .then(data => {
            songsData = data;
            console.log("Zenék sikeresen betöltve:", songsData);
        })
        .catch(err => {
            titleEl.textContent = "Hiba a JSON betöltésekor!";
            console.error(err);
        });

    // 2. Random zene és refrén indítása gombnyomásra
    playBtn.addEventListener('click', () => {
        if (songsData.length === 0) {
            alert("Még nem töltődtek be a zenék a JSON-ből!");
            return;
        }

        // Random zene kiválasztása a tömbből
        const randomIndex = Math.floor(Math.random() * songsData.length);
        const selectedSong = songsData[randomIndex];

        // Adatok frissítése a kijelzőn
        titleEl.textContent = selectedSong.title || "Ismeretlen szám";
        artistEl.textContent = selectedSong.artist || "Ismeretlen előadó";

        // Forrás beállítása a local music mappából
        audio.src = selectedSong.src;

        // Amikor a zene adatai betöltődtek, ugrik a refrénre és elindul
        audio.onloadedmetadata = () => {
            // Refrén kezdete másodpercben (ha nincs megadva a JSON-ben, 0-ról indul)
            const refrenStart = selectedSong.refrenStart || 0; 
            
            audio.currentTime = refrenStart;
            audio.play().catch(e => console.error("Lejátszási hiba:", e));
        };
    });
</script>

</body>
</html>
