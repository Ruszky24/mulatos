<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitster Játék - Teljes Tippelés</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            margin: 0;
        }
        .player-card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            width: 380px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            margin-bottom: 25px;
        }
        button {
            background-color: #1db954;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px 0;
            transition: 0.2s;
        }
        button:hover { background-color: #1ed760; }
        
        .game-container {
            width: 90%;
            max-width: 500px;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
            text-align: left;
        }
        .input-group label {
            font-size: 14px;
            color: #b3b3b3;
        }
        input[type="number"], input[type="text"] {
            padding: 10px 14px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: white;
            outline: none;
        }
        input:focus {
            border-color: #1db954;
        }
        .timeline-list {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .card {
            background: #282828;
            border: 2px solid #1db954;
            padding: 15px;
            border-radius: 10px;
            min-width: 130px;
            text-align: center;
        }
        .card .year { font-size: 20px; font-weight: bold; color: #1db954; }
        .card .details { font-size: 13px; color: #ffffff; margin-top: 5px; }
        .card .artist { color: #b3b3b3; font-size: 11px; }
        .result-msg { font-weight: bold; font-size: 16px; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="player-card">
    <h2>HITSTER JÁTÉK</h2>
    <p>Hallgasd meg a részletet, és találd ki az adatokat!</p>
    
    <audio id="audio-player"></audio>
    <button id="play-btn">🎵 Random Részlet Lejátszása</button>
</div>

<div class="game-container">
    <h3>Tippeld meg az adatokat!</h3>
    
    <div class="input-group">
        <label for="year-input">Kiadási év:</label>
        <input type="number" id="year-input" placeholder="pl. 2021" min="1900" max="2026">
        
        <label for="artist-input">Előadó:</label>
        <input type="text" id="artist-input" placeholder="pl. Döndi Duó">
        
        <label for="title-input">Cím:</label>
        <input type="text" id="title-input" placeholder="pl. Álmodtam egy világot magamnak">
    </div>

    <button id="submit-btn" style="width: 100%;">Elhelyezés az idővonalon</button>

    <div id="result" class="result-msg"></div>

    <h4>Lerakott kártyák az idővonalon:</h4>
    <div id="timeline" class="timeline-list"></div>
</div>

<script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const submitBtn = document.getElementById('submit-btn');
    
    const yearInput = document.getElementById('year-input');
    const artistInput = document.getElementById('artist-input');
    const titleInput = document.getElementById('title-input');
    
    const resultEl = document.getElementById('result');
    const timelineEl = document.getElementById('timeline');

    let songsData = [];
    let currentSong = null;
    let placedCards = [];
    let stopTimeout = null;

    // JSON betöltése
    fetch('songs.json')
        .then(res => res.json())
        .then(data => { 
            songsData = data; 
        })
        .catch(err => console.error("JSON hiba:", err));

    function getRandomNumber(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // Szövegek tisztítása az összehasonlításhoz (kisbetűsítés, szóközök levágása)
    function cleanString(str) {
        return str ? str.toString().toLowerCase().trim() : "";
    }

    // 1. Random zenarészlet indítása
    playBtn.addEventListener('click', () => {
        if (songsData.length === 0) return alert("A zenék még töltődnek!");
        if (stopTimeout) clearTimeout(stopTimeout);
        resultEl.textContent = "";

        currentSong = songsData[getRandomNumber(0, songsData.length - 1)];
        audio.src = currentSong.src;

        audio.onloadedmetadata = () => {
            const startTime = getRandomNumber(45, 70);
            const duration = getRandomNumber(15, 25);

            audio.currentTime = startTime;
            audio.play().catch(e => console.error("Lejátszási hiba:", e));

            stopTimeout = setTimeout(() => {
                audio.pause();
            }, duration * 1000);
        };
    });

    // 2. Tippek ellenőrzése
    submitBtn.addEventListener('click', () => {
        if (!currentSong) return alert("Először indíts el egy zenét!");
        
        const guessedYear = parseInt(yearInput.value);
        const guessedArtist = cleanString(artistInput.value);
        const guessedTitle = cleanString(titleInput.value);

        if (!guessedYear) return alert("Az évszámot kötelező beírni!");

        audio.pause();

        const actualYear = parseInt(currentSong.year);
        const actualArtist = cleanString(currentSong.artist);
        const actualTitle = cleanString(currentSong.title);

        const isYearCorrect = guessedYear === actualYear;
        const isArtistCorrect = guessedArtist === actualArtist;
        const isTitleCorrect = guessedTitle === actualTitle;

        // Eredmény értékelése
        if (isYearCorrect && isArtistCorrect && isTitleCorrect) {
            resultEl.style.color = "#1db954";
            resultEl.textContent = `🎯 TÖKÉLETES TELITALÁLAT! Minden adat helyes!`;
        } else if (isYearCorrect) {
            resultEl.style.color = "#ffb703";
            resultEl.textContent = `Évszám eltalálva! Helyes adatok: ${currentSong.artist} - ${currentSong.title} (${actualYear})`;
        } else {
            resultEl.style.color = "#ff4d4d";
            resultEl.textContent = `❌ Nem talált! Helyes adatok: ${currentSong.artist} - ${currentSong.title} (${actualYear})`;
        }

        // Kártya elhelyezése az idővonalon
        placedCards.push({
            year: actualYear,
            title: currentSong.title,
            artist: currentSong.artist
        });

        placedCards.sort((a, b) => a.year - b.year);
        renderTimeline();
        
        // Mezők ürítése
        currentSong = null;
        yearInput.value = "";
        artistInput.value = "";
        titleInput.value = "";
    });

    function renderTimeline() {
        timelineEl.innerHTML = "";
        placedCards.forEach(card => {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            cardDiv.innerHTML = `
                <div class="year">${card.year}</div>
                <div class="artist">${card.artist}</div>
                <div class="details"><b>${card.title}</b></div>
            `;
            timelineEl.appendChild(cardDiv);
        });
    }
</script>

</body>
</html>
