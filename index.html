<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mulatós Hitster</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
        .card { border: 2px solid #e91e63; padding: 15px; margin: 10px; display: inline-block; border-radius: 8px; background: #1e1e1e; }
        .timeline { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
        button { background: #e91e63; color: white; border: none; padding: 15px 25px; font-size: 18px; cursor: pointer; border-radius: 8px; margin: 8px; font-weight: bold; }
        button:disabled { background: #555; cursor: not-allowed; }
        #status { color: #ffeb3b; font-size: 14px; margin-bottom: 15px; }
        #youtube-player { display: none; }
    </style>
</head>
<body>

    <h1>🎤 Mulatós Hitster</h1>
    <div id="status">⏳ Lejátszó betöltése...</div>

    <div id="player-container">
        <button id="playBtn" onclick="playCurrentSong()" disabled>🎵 Zene Indítása</button>
        <button id="pauseBtn" onclick="pauseCurrentSong()" disabled>⏸️ Szünet</button>
        <button id="nextBtn" onclick="nextTurn()" disabled>⏭️ Következő kártya</button>
    </div>

    <h3>Idővonal:</h3>
    <div class="timeline" id="timeline"></div>

    <!-- YouTube iframe rejtve -->
    <div id="youtube-player"></div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let songs = [];
        let timeline = [];
        let currentSong = null;
        let player = null;
        let isPlayerReady = false;

        // YouTube API inicializálása
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                events: {
                    'onReady': () => {
                        isPlayerReady = true;
                        document.getElementById('status').innerText = "✅ Lejátszó kész! Töltsd be a dalokat.";
                        enableButtons();
                    },
                    'onError': (e) => {
                        document.getElementById('status').innerText = "⚠️ A videó nem ágyazható be! (Próbálj másik YouTube ID-t)";
                    }
                }
            });
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        async function loadSongs() {
            try {
                const response = await fetch('./songs.json?v=' + new Date().getTime());
                songs = await response.json();
                shuffle(songs);
                initGame();
            } catch (error) {
                document.getElementById('status').innerText = "❌ Hiba a JSON betöltésekor!";
            }
        }

        function initGame() {
            if (songs.length === 0) return;
            const firstSong = songs.pop();
            timeline.push(firstSong);
            renderTimeline();
            nextTurn();
        }

        function nextTurn() {
            if (songs.length === 0) {
                alert("Gratulálok, elfogyott a pakli!");
                return;
            }
            currentSong = songs.pop();
            document.getElementById('status').innerText = "🎶 Új dal készen áll. Nyomj a Lejátszásra!";
        }

        function playCurrentSong() {
            if (currentSong && player && isPlayerReady) {
                player.loadVideoById(currentSong.youtubeId);
                player.playVideo();
                document.getElementById('status').innerText = "▶️ Zene szól...";
            }
        }

        function pauseCurrentSong() {
            if (player && isPlayerReady) {
                player.pauseVideo();
                document.getElementById('status').innerText = "⏸️ Szüneteltetve";
            }
        }

        function enableButtons() {
            document.getElementById('playBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = false;
            document.getElementById('nextBtn').disabled = false;
        }

        function renderTimeline() {
            const container = document.getElementById("timeline");
            container.innerHTML = "";
            timeline.forEach((song) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `<strong>${song.eloado}</strong><br>${song.cim}<br><em>${song.ev}</em>`;
                container.appendChild(card);
            });
        }

        loadSongs();
    </script>
</body>
</html>
