<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitster Zenei Idővonal Játék</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        .player-card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            width: 350px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            margin-bottom: 30px;
        }
        button {
            background-color: #1db954;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px 5px;
            transition: 0.2s;
        }
        button:hover { background-color: #1ed760; }
        
        .timeline-container {
            width: 90%;
            max-width: 800px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
        }
        .guess-box {
            margin: 20px 0;
        }
        input[type="number"] {
            padding: 10px;
            font-size: 18px;
            width: 100px;
            border-radius: 8px;
            border: none;
            text-align: center;
        }
        .timeline-list {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .card {
            background: #282828;
            border: 2px solid #1db954;
            padding: 15px;
            border-radius: 10px;
            min-width: 120px;
            text-align: center;
        }
        .card .year { font-size: 22px; font-weight: bold; color: #1db954; }
        .card .details { font-size: 12px; color: #b3b3b3; margin-top: 5px; }
        .result-msg { font-weight: bold; font-size: 18px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="player-card">
    <h2>Hitster Játék</h2>
    <p>Hallgasd meg a részletet és találd ki a kiadási évet!</p>
    
    <audio id="audio-player"></audio>
    <button id="play-btn">🎵 Random Részlet Lejátszása</button>
</div>

<div class="timeline-container">
    <h3>Tippeld meg a kiadási évet!</h3>
    
    <div class="guess-box">
        <input type="number" id="year-input" placeholder="pl. 2021" min="1900" max="2026">
        <button id="submit-btn">Elhelyezés az idővonalon</button>
    </div>

    <div id="result" class="result-msg"></div>

    <h4>Lerakott kártyák az idővonalon:</h4>
    <div id="timeline" class="timeline-list"></div>
</div>

<script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const submitBtn = document.getElementById('submit-btn');
    const yearInput = document.getElementById('year-input');
    const resultEl = document.getElementById('result');
    const timelineEl = document.getElementById('timeline');

    let songsData = [];
    let currentSong = null;
    let placedCards = []; // Lerakott kártyák a meccs során
    let stopTimeout = null;

    fetch('songs.json')
        .then(res => res.json())
        .then(data => { songsData = data; });

    function getRandomNumber(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // 1. Random zenei részlet indítása (45-70mp között, 15-25mp hosszan)
    playBtn.addEventListener('click', () => {
        if (songsData.length === 0) return alert("A zenék még töltődnek!");
        if (stopTimeout) clearTimeout(stopTimeout);
        resultEl.textContent = "";

        // Random zene kiválasztása
        currentSong = songsData[getRandomNumber(0, songsData.length - 1)];
        audio.src = currentSong.src;

        audio.onloadedmetadata = () => {
            const startTime = getRandomNumber(45, 70);
            const duration = getRandomNumber(15, 25);

            audio.currentTime = startTime;
            audio.play();

            stopTimeout = setTimeout(() => {
                audio.pause();
            }, duration * 1000);
        };
    });

    // 2. Tipp ellenőrzése és elhelyezése az idővonalon
    submitBtn.addEventListener('click', () => {
        if (!currentSong) return alert("Először indíts el egy zenét!");
        
        const guessedYear = parseInt(yearInput.value);
        if (!guessedYear) return alert("Írj be egy évszámot!");

        audio.pause();

        // Ellenőrzés: Eltalálta a pontos évet? (Vagy ha csak a sorrendet nézzük)
        if (guessedYear === currentSong.year) {
            resultEl.style.color = "#1db954";
            resultEl.textContent = `🎯 TELITALÁLAT! (${currentSong.artist} - ${currentSong.title}, ${currentSong.year})`;
        } else {
            resultEl.style.color = "#ff4d4d";
            resultEl.textContent = `❌ Sajnálom! A helyes év: ${currentSong.year} (${currentSong.artist} - ${currentSong.title})`;
        }

        // Hozzáadás az idővonalhoz
        placedCards.push({
            year: currentSong.year,
            title: currentSong.title,
            artist: currentSong.artist
        });

        // Idővonal sorbarendezése évszám szerint
        placedCards.sort((a, b) => a.year - b.year);

        // Idővonal kirajzolása a képernyőre
        renderTimeline();
        
        // Alaphelyzetbe állítás
        currentSong = null;
        yearInput.value = "";
    });

    function renderTimeline() {
        timelineEl.innerHTML = "";
        placedCards.forEach(card => {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            cardDiv.innerHTML = `
                <div class="year">${card.year}</div>
                <div class="details">${card.artist}<br><b>${card.title}</b></div>
            `;
            timelineEl.appendChild(cardDiv);
        });
    }
</script>

</body>
</html>
